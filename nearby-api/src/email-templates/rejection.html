<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark only" />
<title>Photo Submission Update</title>
<style type="text/css">
  @media only screen and (max-width: 600px) {
    .email-container { width: 100% !important; padding: 0 !important; }
    .content-cell { padding: 24px !important; }
    h1 { font-size: 22px !important; line-height: 28px !important; }
    .footer-text { font-size: 11px !important; }
  }
  .ExternalClass, .ExternalClass * { line-height: 100%; }
  body { margin: 0; padding: 0; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
  img { border: 0; outline: none; text-decoration: none; }
  table { border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
</style>
</head>
<body style="margin:0;padding:0;background-color:#0a0a0a;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
  style="background-color:#0a0a0a;min-width:100%;" class="email-bg">
  <tr>
    <td align="center" style="padding:0;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600"
        style="background-color:#0a0a0a;min-width:600px;" class="email-container">
        <tr>
          <td style="padding:32px 0 8px 0;text-align:center;">
            <span style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;font-weight:800;letter-spacing:1px;color:#F5C518;">🎬 SCENE NEARBY</span>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:8px 32px 32px 32px;" class="content-cell">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
              style="background-color:#161616;border-radius:16px;border:1px solid #2a2a2a;">
              <tr>
                <td style="padding:32px 32px 24px 32px;" class="content-cell">
                  <h1 style="margin:0 0 6px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:24px;font-weight:700;color:#f5f5f5;line-height:30px;">
                    Update on your photo submission
                  </h1>
                  <p style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;color:#9b9b9b;">
                    {{location_name}} · {{app_name}}
                  </p>
                </td>
              </tr>
              <tr>
                <td style="padding:0 32px 28px 32px;" class="content-cell">
                  {{body_paragraphs}}
                  <p style="margin:18px 0 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;color:#9b9b9b;">
                    — The Scene Nearby Team
                  </p>
                </td>
              </tr>
              <tr>
                <td style="padding:0 32px 24px 32px;" class="content-cell">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                    <tr>
                      <td style="border-top:1px solid #2a2a2a;padding-top:16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;color:#6b6b6b;" class="footer-text">
                        You're receiving this because you submitted a photo through the {{app_name}} app.
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
