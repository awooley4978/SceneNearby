<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark only" />
<meta name="supported-color-schemes" content="dark only" />
<title>Scene Nearby</title>
<style type="text/css">
  /* ── Responsive overrides ── */
  @media only screen and (max-width: 600px) {
    .email-body { width: 100% !important; }
    .email-container { width: 100% !important; padding: 0 !important; }
    .content-cell { padding: 24px !important; }
    .hero-cell { padding: 32px 24px !important; }
    .stack-cell { display: block !important; width: 100% !important; }
    .stack-cell img { width: 100% !important; height: auto !important; }
    .hide-mobile { display: none !important; }
    .btn-full { width: 100% !important; }
    h1 { font-size: 24px !important; }
    h2 { font-size: 20px !important; }
    .footer-text { font-size: 11px !important; }
  }

  /* ── Dark mode compatibility ── */
  @media (prefers-color-scheme: dark) {
    body, .email-bg { background-color: #0a0a0a !important; }
    .card-bg { background-color: #1a1a1a !important; }
  }

  /* ── Force Outlook to respect dark backgrounds ── */
  .ExternalClass, .ExternalClass * { line-height: 100%; }
  .ExternalClass p, .ExternalClass span, .ExternalClass font, .ExternalClass td, .ExternalClass div { line-height: inherit; }
  body { margin: 0; padding: 0; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
  img { border: 0; outline: none; text-decoration: none; }
  table { border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
</style>
</head>
<body style="margin:0;padding:0;background-color:#0a0a0a;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">

<!-- ═══════════ OUTER WRAPPER ═══════════ -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
  style="background-color:#0a0a0a;min-width:100%;" class="email-bg">
  <tr>
    <td align="center" style="padding:0;">

      <!-- ═══════════ CONTAINER (600px) ═══════════ -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600"
        style="width:600px;max-width:600px;margin:0 auto;background-color:#0a0a0a;" class="email-container">

        <!-- ═══════ HEADER ═══════ -->
        <tr>
          <td align="center" style="padding:32px 40px 0 40px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="padding-bottom:8px;">
                  <!-- Gold dot + logo -->
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td width="16" align="center" valign="middle">
                        <!--[if mso]>
                        <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml"
                          xmlns:w="urn:schemas-microsoft-com:office:word"
                          style="height:16px;width:16px;v-text-anchor:middle;"
                          arcsize="50%" fillcolor="#F5C518">
                        <w:anchorlock/>
                        </v:roundrect>
                        <![endif]-->
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:16px;height:16px;">
                          <tr>
                            <td width="16" height="16" bgcolor="#F5C518" style="width:16px;height:16px;background-color:#F5C518;border-radius:50%;line-height:0;">
                              &nbsp;
                            </td>
                          </tr>
                        </table>
                      </td>
                      <td width="12">&nbsp;</td>
                      <td style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:20px;font-weight:700;color:#ffffff;letter-spacing:-0.3px;line-height:24px;">
                        Scene Nearby
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- ═══════ DECORATIVE GOLD LINE ═══════ -->
        <tr>
          <td height="1" style="height:1px;line-height:0;font-size:0;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
              <tr>
                <td width="40" style="width:40px;">&nbsp;</td>
                <td style="border-bottom:1px solid #F5C518;border-color:#F5C518;opacity:0.2;">&nbsp;</td>
                <td width="40" style="width:40px;">&nbsp;</td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- ═══════ BODY CONTENT SLOT (template-specific) ═══════ -->
        {{BODY}}

        <!-- ═══════ FOOTER ═══════ -->
        <tr>
          <td style="padding:40px 40px 20px 40px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
              <!-- Gold divider -->
              <tr>
                <td height="1" style="height:1px;line-height:0;font-size:0;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                    <tr>
                      <td style="border-bottom:1px solid #F5C518;border-color:#F5C518;opacity:0.1;">&nbsp;</td>
                    </tr>
                  </table>
                </td>
              </tr>
              <tr><td height="32">&nbsp;</td></tr>
              <!-- Footer text -->
              <tr>
                <td align="center" class="footer-text" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;color:#666666;line-height:20px;">
                  You're receiving this email because you signed up for Scene Nearby.<br />
                  <a href="{{unsubscribe_url}}" style="color:#F5C518;text-decoration:underline;">Unsubscribe</a>
                  &nbsp;&middot;&nbsp;
                  <a href="{{privacy_url}}" style="color:#888888;text-decoration:underline;">Privacy</a>
                </td>
              </tr>
              <tr><td height="16">&nbsp;</td></tr>
              <tr>
                <td align="center" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:10px;color:#444444;line-height:16px;">
                  Scene Nearby &middot; 123 Film Street &middot; Los Angeles, CA 90028
                </td>
              </tr>
              <tr><td height="24">&nbsp;</td></tr>
              <tr>
                <td align="center" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:10px;color:#333333;line-height:16px;">
                  &copy; 2026 Scene Nearby. All rights reserved.
                </td>
              </tr>
            </table>
          </td>
        </tr>

      </table>
      <!-- /container -->
    </td>
  </tr>
</table>
<!-- /outer wrapper -->

</body>
</html>
